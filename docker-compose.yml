services:
  credential-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: envkeep
      POSTGRES_PASSWORD: ${CREDENTIAL_DB_PASSWORD:?CREDENTIAL_DB_PASSWORD is required}
      POSTGRES_DB: envkeep
    volumes:
      - credential-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U envkeep -d envkeep']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - credential-internal

  migrate:
    build: .
    command: ['node', 'dist/cli/index.js', 'migrate']
    environment:
      DATABASE_URL: postgres://envkeep:${CREDENTIAL_DB_PASSWORD}@credential-postgres:5432/envkeep
    depends_on:
      credential-postgres:
        condition: service_healthy
    networks:
      - credential-internal

  credential-service:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://envkeep:${CREDENTIAL_DB_PASSWORD}@credential-postgres:5432/envkeep
      ENVKEEP_MASTER_KEY: ${ENVKEEP_MASTER_KEY:?ENVKEEP_MASTER_KEY is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - credential-internal

networks:
  credential-internal:
    name: credential-internal

volumes:
  credential-pgdata:
